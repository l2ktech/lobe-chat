name: Build LobeChat with Clerk

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - 'Dockerfile.clerk'
      - '.github/workflows/build-with-clerk.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: lobe-chat-clerk

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
      
      - name: 构建并推送轻量级 Clerk 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.clerk
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
          platforms: linux/amd64,linux/arm64
      
      - name: 输出镜像信息
        run: |
          echo "## 🎉 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 镜像信息" >> $GITHUB_STEP_SUMMARY
          echo "- **仓库**: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: latest, ${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ 重要说明" >> $GITHUB_STEP_SUMMARY
          echo "这是基于官方镜像的轻量级构建，仅添加了 Clerk 环境变量。" >> $GITHUB_STEP_SUMMARY
          echo "如果 Clerk 认证不生效，需要从源码完整构建。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 使用方法" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "version: '3.8'" >> $GITHUB_STEP_SUMMARY
          echo "services:" >> $GITHUB_STEP_SUMMARY
          echo "  lobe-chat:" >> $GITHUB_STEP_SUMMARY
          echo "    image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "    ports:" >> $GITHUB_STEP_SUMMARY
          echo "      - 3210:3210" >> $GITHUB_STEP_SUMMARY
          echo "    environment:" >> $GITHUB_STEP_SUMMARY
          echo "      - CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}" >> $GITHUB_STEP_SUMMARY
          echo "      - CLERK_WEBHOOK_SECRET=your_webhook_secret" >> $GITHUB_STEP_SUMMARY
          echo "      - APP_URL=http://localhost:3210" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
